services:
  postgres:
    image: postgres:16
    container_name: manga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: ["5433:5432"]
    volumes:
      - manga_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [manga-network]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: manga-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    ports: ["5672:5672", "15672:15672"]
    volumes: [manga_rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [manga-network]

  redis:
    image: redis:7
    container_name: manga-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [manga_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [manga-network]

  minio:
    image: minio/minio
    container_name: manga-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: ["9000:9000", "9001:9001"]
    volumes: [manga_minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [manga-network]

  seq:
    image: datalust/seq:latest
    container_name: manga-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?SEQ_ADMIN_PASSWORD is required}
    ports: ["5341:80"]
    volumes: [manga_seq_data:/data]
    networks: [manga-network]

  identity-api: &api-common
    build:
      context: .
      dockerfile: services/identity-service/Manga.Identity.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      InternalGrpc__ApiKey: ${INTERNAL_GRPC_API_KEY:?INTERNAL_GRPC_API_KEY is required}
      Kestrel__Endpoints__Rest__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=IdentityDB;Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      Redis__ConnectionString: redis:6379
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      Serilog__WriteTo__1__Args__serverUrl: http://seq
      IdentityBootstrap__Enabled: ${IDENTITY_BOOTSTRAP_ENABLED:-false}
      IdentityBootstrap__RecoveryEnabled: ${IDENTITY_BOOTSTRAP_RECOVERY_ENABLED:-false}
      IdentityBootstrap__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      IdentityBootstrap__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    expose: ["8080", "8081"]
    healthcheck: &api-healthcheck
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [manga-network]

  manga-api:
    <<: *api-common
    build:
      context: .
      dockerfile: services/manga-service/Manga.Management.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      InternalGrpc__ApiKey: ${INTERNAL_GRPC_API_KEY:?INTERNAL_GRPC_API_KEY is required}
      Kestrel__Endpoints__Rest__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      ConnectionStrings__MangaDb: Host=postgres;Port=5432;Database=MangaManagementDB;Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      Redis__ConnectionString: redis:6379
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      Grpc__Identity__Address: http://identity-api:8081
      Grpc__File__Address: http://file-api:8081
      Serilog__WriteTo__1__Args__serverUrl: http://seq

  file-api:
    <<: *api-common
    build:
      context: .
      dockerfile: services/file-service/Manga.File.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      InternalGrpc__ApiKey: ${INTERNAL_GRPC_API_KEY:?INTERNAL_GRPC_API_KEY is required}
      Kestrel__Endpoints__Rest__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      ConnectionStrings__FileDb: Host=postgres;Port=5432;Database=FileServiceDB;Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      Redis__ConnectionString: redis:6379
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      Storage__Provider: Minio
      Storage__Minio__Endpoint: minio:9000
      Storage__Minio__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      Storage__Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      Storage__Minio__PublicBaseUrl: ${MINIO_PUBLIC_BASE_URL:?MINIO_PUBLIC_BASE_URL is required}
      FileStorage__Provider: Minio
      FileStorage__Minio__Endpoint: minio:9000
      FileStorage__Minio__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      FileStorage__Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      FileStorage__Minio__BucketName: manga-files
      FileStorage__Minio__PublicBaseUrl: ${MINIO_PUBLIC_BASE_URL:?MINIO_PUBLIC_BASE_URL is required}
      Grpc__Manga__Address: http://manga-api:8081
      Serilog__WriteTo__1__Args__serverUrl: http://seq

  editorial-api:
    <<: *api-common
    build:
      context: .
      dockerfile: services/editorial-service/Manga.Editorial.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      InternalGrpc__ApiKey: ${INTERNAL_GRPC_API_KEY:?INTERNAL_GRPC_API_KEY is required}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EditorialDb: Host=postgres;Port=5432;Database=EditorialDB;Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      Redis__ConnectionString: redis:6379
      Grpc__Manga__Address: http://manga-api:8081
      Serilog__WriteTo__1__Args__serverUrl: http://seq

  notification-api:
    <<: *api-common
    build:
      context: .
      dockerfile: services/notification-service/Manga.Notification.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      InternalGrpc__ApiKey: ${INTERNAL_GRPC_API_KEY:?INTERNAL_GRPC_API_KEY is required}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NotificationDb: Host=postgres;Port=5432;Database=NotificationDB;Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      Redis__ConnectionString: redis:6379
      Serilog__WriteTo__1__Args__serverUrl: http://seq

  gateway:
    build:
      context: .
      dockerfile: gateway/Manga.Gateway/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      Gateway__Cors__AllowedOrigins__0: ${GATEWAY__CORS__ALLOWEDORIGINS__0:?GATEWAY__CORS__ALLOWEDORIGINS__0 is required}
      Gateway__Cors__AllowedOrigins__1: ${GATEWAY__CORS__ALLOWEDORIGINS__1:-}
      Gateway__HealthCheckTimeoutSeconds: ${GATEWAY__HEALTHCHECKTIMEOUTSECONDS:-3}
      Gateway__RateLimiting__PermitLimit: ${GATEWAY__RATELIMITING__PERMITLIMIT:-300}
      Gateway__RateLimiting__WindowSeconds: ${GATEWAY__RATELIMITING__WINDOWSECONDS:-60}
      Gateway__DefaultProxyTimeoutSeconds: ${GATEWAY__DEFAULTPROXYTIMEOUTSECONDS:-120}
      Gateway__FileProxyTimeoutSeconds: ${GATEWAY__FILEPROXYTIMEOUTSECONDS:-600}
      Gateway__MaxFileUploadBytes: ${GATEWAY__MAXFILEUPLOADBYTES:-52428800}
      Gateway__Health__ExposeServiceDetails: ${GATEWAY__HEALTH__EXPOSESERVICEDETAILS:-false}
      Gateway__TransportSecurity__EnableHttpsRedirection: ${GATEWAY__TRANSPORTSECURITY__ENABLEHTTPSREDIRECTION:-true}
      Gateway__TransportSecurity__EnableHsts: ${GATEWAY__TRANSPORTSECURITY__ENABLEHSTS:-true}
      Gateway__TransportSecurity__HstsMaxAgeDays: ${GATEWAY__TRANSPORTSECURITY__HSTSMAXAGEDAYS:-365}
      Gateway__TransportSecurity__HttpsPort: ${GATEWAY__TRANSPORTSECURITY__HTTPSPORT:-443}
      ForwardedHeaders__Enabled: ${FORWARDEDHEADERS__ENABLED:-true}
      ForwardedHeaders__KnownProxies__0: ${FORWARDEDHEADERS__KNOWNPROXIES__0:-}
      ForwardedHeaders__KnownNetworks__0: ${FORWARDEDHEADERS__KNOWNNETWORKS__0:-}
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address: http://identity-api:8080/
      ReverseProxy__Clusters__manga-cluster__Destinations__manga-api__Address: http://manga-api:8080/
      ReverseProxy__Clusters__files-cluster__Destinations__file-api__Address: http://file-api:8080/
      ReverseProxy__Clusters__editorial-cluster__Destinations__editorial-api__Address: http://editorial-api:8080/
      ReverseProxy__Clusters__notifications-cluster__Destinations__notification-api__Address: http://notification-api:8080/
      Serilog__WriteTo__1__Args__serverUrl: http://seq
    depends_on:
      identity-api: { condition: service_healthy }
      manga-api: { condition: service_healthy }
      file-api: { condition: service_healthy }
      editorial-api: { condition: service_healthy }
      notification-api: { condition: service_healthy }
    ports: ["5200:8080"]
    healthcheck: *api-healthcheck
    networks: [manga-network]

networks:
  manga-network:
    driver: bridge

volumes:
  manga_postgres_data:
  manga_rabbitmq_data:
  manga_redis_data:
  manga_minio_data:
  manga_seq_data:
