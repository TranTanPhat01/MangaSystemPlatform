syntax = "proto3";

option csharp_namespace = "Manga.Contracts.Management.V1";

package manga.management.v1;

service MangaManagementGrpcService {
  rpc GetSeriesById (GetSeriesByIdRequest) returns (GetSeriesByIdResponse);
  rpc GetChapterById (GetChapterByIdRequest) returns (GetChapterByIdResponse);
  rpc CanAccessFile (CanAccessFileRequest) returns (CanAccessFileResponse);
  rpc ApplyProposalDecision (ApplyProposalDecisionRequest) returns (ApplyProposalDecisionResponse);
}

message GetSeriesByIdRequest {
  string series_id = 1;
}

message GetSeriesByIdResponse {
  string series_id = 1;
  string title = 2;
  string status = 3;
  string author_user_id = 4;
}

message GetChapterByIdRequest {
  string chapter_id = 1;
}

message GetChapterByIdResponse {
  string chapter_id = 1;
  string series_id = 2;
  string title = 3;
  int32 number = 4;
  string status = 5;
}

message CanAccessFileRequest {
  string user_id = 1;
  string file_id = 2;
  string access_type = 3;
}

message CanAccessFileResponse {
  bool allowed = 1;
}

message ApplyProposalDecisionRequest {
  string series_id = 1;
  string decision = 2;
  string reason = 3;
}

message ApplyProposalDecisionResponse {
  bool applied = 1;
}
