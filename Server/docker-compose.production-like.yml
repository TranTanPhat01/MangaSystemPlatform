services:
  gateway:
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/api.manga.local.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${TLS_CERTIFICATE_PASSWORD:?TLS_CERTIFICATE_PASSWORD is required}
    ports:
      - "80:8080"
      - "443:8443"
      - "5200:8080"
    volumes:
      - ./certs/api.manga.local.pfx:/https/api.manga.local.pfx:ro
